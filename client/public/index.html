<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the chat
      composer and headers can clear the notch and the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0D14" />
    <meta
      name="description"
      content="TalkStream is an open-source real-time chat platform with live typing indicators, read receipts, online presence and media sharing — built on Socket.IO, a TypeScript API and MongoDB."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>TalkStream — Real-Time Chat, Built for Speed</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TalkStream" />
    <meta
      property="og:title"
      content="TalkStream — Real-Time Chat, Built for Speed"
    />
    <meta
      property="og:description"
      content="Open-source real-time messaging: typing indicators, read receipts, presence and media sharing over a persistent WebSocket connection."
    />
    <meta property="og:image" content="%PUBLIC_URL%/img/chat-landing.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TalkStream — Real-Time Chat, Built for Speed"
    />
    <meta
      name="twitter:description"
      content="Open-source real-time messaging: typing indicators, read receipts, presence and media sharing over a persistent WebSocket connection."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/img/chat-landing.png" />

    <!--
      Fonts — two variable families, one request.

      Plus Jakarta Sans covers body AND display (it replaced DM Sans, Syne and
      Public Sans); JetBrains Mono covers labels, tags and code. Both are
      requested as variable weight ranges (wght@400..800), so each family is a
      single file spanning every weight instead of one file per static weight.

      One early connection warm-up, then a single non-blocking request.
      display=swap so text paints immediately in the fallback face rather
      than staying invisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..500&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="
        this.media = 'all';
        this.onload = null;
      "
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..500&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..500&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      />
    </noscript>
    <style>
      html,
      body {
        background: #0b0d14;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
